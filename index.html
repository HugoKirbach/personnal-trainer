<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Personal Trainer</title>
  <meta name="description" content="Programme escalade, muscu et course, chrono et suivi.">
  <meta name="theme-color" content="#14161a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <span class="brand">🧗 Personal Trainer</span>
    <span id="week-badge" class="badge"></span>
  </header>
  <main id="main"></main>
  <nav>
    <button data-go="today"><span>📅</span>Aujourd'hui</button>
    <button data-go="week"><span>🗓️</span>Semaine</button>
    <button data-go="timer"><span>⏱️</span>Chrono</button>
    <button data-go="stats"><span>📈</span>Suivi</button>
    <button data-go="settings"><span>⚙️</span>Réglages</button>
  </nav>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="tooltip" class="tooltip" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
